<!doctype html>
<html lang="en">
<head>

  <title>Thank you for reporting</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #f0fdf4; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #fff; padding: 40px; border-radius: 8px; max-width: 520px;
            box-shadow: 0 4px 16px rgba(0,0,0,.12); text-align: center; }
    h1 { color: #065f46; font-size: 22px; margin: 0 0 16px; }
    p { color: #374151; font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Great job!</h1>
    <p>You correctly identified this message as a simulated phishing attempt and

    <p>Your security team thanks you.</p>
  </div>

</html>
